<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mob Shooter 3D - Édition Pro & Admin</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- Interface Joueur (HUD) -->
        <div id="hud">
            <div id="top-bar">
                <div class="stat-pill" id="level-pill">NIVEAU <span id="hud-level">1</span></div>
                <div id="progress-wrapper">
                    <div id="progress-bar"></div>
                    <span id="progress-text">0%</span>
                </div>
                <div class="stat-pill gold-pill">💰 <span id="hud-coins">0</span></div>
                <button id="btn-open-admin" class="icon-btn" title="Mode Admin">🛠️</button>
            </div>
        </div>

        <!-- Menu Principal / Boutique avant le départ -->
        <div id="lobby-screen" class="overlay-screen">
            <div class="logo-box">
                <h1>MOB SHOOTER 3D</h1>
                <p>Tire sur les portails pour agrandir ton armée !</p>
            </div>

            <div class="shop-grid">
                <div class="shop-card" onclick="game.buyUpgrade('fireRate')">
                    <div class="card-icon">⚡</div>
                    <div class="card-title">CADENCE</div>
                    <div class="card-lvl">Niv. <span id="lvl-fireRate">1</span></div>
                    <div class="card-price">💰 <span id="cost-fireRate">100</span></div>
                </div>
                <div class="shop-card" onclick="game.buyUpgrade('damage')">
                    <div class="card-icon">🔥</div>
                    <div class="card-title">DÉGÂTS</div>
                    <div class="card-lvl">Niv. <span id="lvl-damage">1</span></div>
                    <div class="card-price">💰 <span id="cost-damage">100</span></div>
                </div>
                <div class="shop-card" onclick="game.buyUpgrade('income')">
                    <div class="card-icon">💎</div>
                    <div class="card-title">REVENUS</div>
                    <div class="card-lvl">Niv. <span id="lvl-income">1</span></div>
                    <div class="card-price">💰 <span id="cost-income">100</span></div>
                </div>
            </div>

            <button id="btn-play" class="play-btn" onclick="game.startLevel()">JOUER</button>
        </div>

        <!-- Écran de Fin de Niveau -->
        <div id="end-screen" class="overlay-screen hidden">
            <div class="end-box">
                <h2 id="end-title">VICTOIRE !</h2>
                <div class="reward-display">💰 +<span id="end-reward">0</span></div>
                <button class="play-btn" onclick="game.nextLevel()">CONTINUER</button>
            </div>
        </div>

        <!-- Panneau Admin / Éditeur de Niveaux -->
        <div id="admin-modal" class="hidden">
            <div class="admin-content">
                <div class="admin-header">
                    <h2>🛠️ Éditeur de Niveaux & Cheats</h2>
                    <button class="close-btn" onclick="admin.close()">✖</button>
                </div>

                <!-- Section Cheats Rapides -->
                <div class="admin-section">
                    <h3>⚡ Cheats Rapides</h3>
                    <div class="btn-group">
                        <button class="adm-btn" onclick="admin.addCoins(10000)">+10 000 💰</button>
                        <button class="adm-btn" onclick="admin.spawnSoldiers(20)">+20 Soldats</button>
                        <button class="adm-btn" onclick="admin.toggleGodMode()">God Mode: <span id="god-status">OFF</span></button>
                    </div>
                </div>

                <!-- Sélection / Création de Niveau -->
                <div class="admin-section">
                    <h3>🗺️ Gestion des Niveaux</h3>
                    <div class="row">
                        <select id="admin-level-select" onchange="admin.selectLevel(this.value)"></select>
                        <button class="adm-btn primary" onclick="admin.createNewLevel()">+ Nouveau Niveau</button>
                        <button class="adm-btn danger" onclick="admin.deleteCurrentLevel()">Supprimer</button>
                    </div>
                    <div class="row">
                        <label>Longueur du niveau :</label>
                        <input type="number" id="admin-lvl-length" value="200" min="100" max="1000" step="20">
                        <button class="adm-btn" onclick="admin.updateLevelProps()">Appliquer</button>
                    </div>
                </div>

                <!-- Ajout d'éléments sur la route -->
                <div class="admin-section">
                    <h3>➕ Ajouter un Élément</h3>
                    <div class="form-grid">
                        <div>
                            <label>Type :</label>
                            <select id="el-type">
                                <option value="gate">Portail (Tir pour améliorer)</option>
                                <option value="enemies">Groupe d'Ennemis</option>
                                <option value="tires">Pile de Pneus (Obstacle)</option>
                                <option value="boss">Boss Géant</option>
                            </select>
                        </div>
                        <div>
                            <label>Position Z (Distance) :</label>
                            <input type="number" id="el-z" value="50" min="15" max="950">
                        </div>
                        <div>
                            <label>Position X (-4 à +4) :</label>
                            <input type="number" id="el-x" value="0" min="-4" max="4" step="0.5">
                        </div>
                        <div>
                            <label>Valeur / PV / Nombre :</label>
                            <input type="number" id="el-val" value="-10">
                        </div>
                    </div>
                    <button class="adm-btn success full-width" onclick="admin.addElement()">Ajouter au Niveau</button>
                </div>

                <!-- Liste des éléments du niveau -->
                <div class="admin-section">
                    <h3>📋 Éléments du Niveau (<span id="el-count">0</span>)</h3>
                    <div id="admin-el-list" class="el-list"></div>
                </div>

                <div class="admin-footer">
                    <button class="adm-btn success" onclick="admin.saveAndReload()">💾 Sauvegarder & Tester</button>
                    <button class="adm-btn" onclick="admin.resetDefaults()">🔄 Réinitialiser par défaut</button>
                </div>
            </div>
        </div>
    </div>

    <script src="textures.js"></script>
    <script src="game.js"></script>
</body>
</html>
